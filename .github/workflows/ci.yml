name: CodeMind CI

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      CODEMIND_EMBEDDING_PROVIDER: mock
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Configure Git for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: CLI smoke check
        run: |
          codemind --help
          python -m codemind.cli --help

      - name: Run test suite with pytest
        run: |
          pytest -v --tb=short -ra

      - name: Run milestone acceptance benchmarks smoke check
        run: |
          python scripts/benchmark_targets.py
